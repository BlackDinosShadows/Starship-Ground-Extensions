//------------------Real Scale miscellaneous patches------------------//

@PART[Booster_*|Ship_*]:NEEDS[SMURFF]
{
	%SMURFFExclude = true
}

@PART[Booster_*|Ship_*]:NEEDS[SolSystem]:BEFORE[StarshipExpansionProject]
{
    %SystemScale = #$@Sol_Configuration/SystemScale$
}

@PART[Booster_*|Ship_*]:NEEDS[RealSolarSystem,!SolSystem]:BEFORE[StarshipExpansionProject]
{
    %SystemScale = Real
}

@PART[Booster_*|Ship_*]:FINAL
{
	!SystemScale = delete
}

@PART[Booster_*|Ship_*]:HAS[#SystemScale[?eal]]:FOR[StarshipExpansionProject]
{
	%rescaleFactor = 1.6
}